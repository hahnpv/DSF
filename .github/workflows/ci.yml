name: CI

on:
  push:
  pull_request:

# Note: the sibling `sixdof` model repo is not available in CI, so the
# simulation tests that dlopen libsixdof.so are skipped automatically
# (see python/tests/conftest.py::require_sixdof). Everything else runs.

jobs:
  build-and-test:
    name: Build + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake g++ ninja-build \
            libboost-dev libboost-program-options-dev libboost-system-dev \
            libboost-serialization-dev \
            libhdf5-dev \
            xvfb libgl1 libegl1 libxkbcommon0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure & build (C++ core + extension + tests)
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j

      - name: C++ unit tests (ctest)
        working-directory: build
        run: ctest --output-on-failure

      - name: Install Python package
        # scikit-build-core compiles the extension into the package — no
        # .so copying. The plain cmake build above still provides the C++
        # test binaries and the build/ copy run.py prefers.
        run: |
          python -m pip install --upgrade pip
          python -m pip install scikit-build-core
          python -m pip install -e . --no-build-isolation
          python -m pip install pytest pytest-qt

      - name: Python tests
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/build
          QT_QPA_PLATFORM: offscreen
        run: xvfb-run -a python -m pytest python/tests -q

  sanitizers:
    name: C++ ASan/UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake g++ ninja-build \
            libboost-dev libboost-program-options-dev libboost-system-dev \
            libboost-serialization-dev libhdf5-dev

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure & build with sanitizers
        run: |
          cmake -S . -B build-asan -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g"
          cmake --build build-asan --target \
            cpp_util_tests cpp_kernel_tests cpp_tablend_tests cpp_integrator_tests -j

      - name: Run C++ tests under ASan/UBSan
        working-directory: build-asan
        env:
          # Third-party libs (HDF5/Boost) and the known legacy-table leaks would
          # otherwise add noise; we care here about memory-safety and UB, so
          # leak detection is off. Any heap-overflow / OOB / UB still fails.
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest -R "cpp_" --output-on-failure
